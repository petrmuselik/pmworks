<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Buy Desco — PMWorks</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="../style.css" />
  <script>
    // Stable checkout entry point. The app's "Buy" button opens this page
    // (Desco Constants.Purchase.checkoutURL), so the checkout links can change —
    // test → live, new product — without shipping a new app build.
    // The default (no ?tier=) is the Single license. Each value is the Dodo Payments
    // checkout link for that tier (quantity locked to 1, redirect_url = ../activate/).
    // Empty = not on sale yet (the page below says so).
    var CHECKOUT_URLS = {
      single: "",
      personal: "",
      family: "",
      company: ""
    };
    // Dodo TEST-mode links, used only when the address has ?test=1 (Debug builds of the
    // app open this page that way, so the whole Buy flow can be tried without real money).
    var TEST_CHECKOUT_URLS = {
      single: "https://dodo.pe/desco-single-e2e"
    };
    var params = new URLSearchParams(window.location.search);
    var tier = params.get("tier") || "single";
    var url = params.get("test") === "1" ? TEST_CHECKOUT_URLS[tier] : CHECKOUT_URLS[tier];
    if (url) {
      window.location.replace(url);
    }
  </script>
</head>
<body>
  <header class="site">
    <a class="brand" href="../index.html"><img src="../images/pmworks-logo.jpg" alt="PMWorks — Productivity by design" /></a>
    <nav>
      <a href="../download.html">Download</a>
      <a href="https://github.com/petrmuselik/pmworks/discussions">Discussions</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>Buy Desco</h1>
      <p class="lede">Purchasing opens soon. Desco is in closed beta — thanks for your interest!</p>
      <p>Questions or feedback? Join the <a href="https://github.com/petrmuselik/pmworks/discussions">Discussions</a>.</p>
    </section>
  </main>
</body>
</html>
