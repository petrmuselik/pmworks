  <link rel="stylesheet" href="../style.css" />
  <script>
    // Stable checkout entry point. The app's "Buy" button opens this page
    // (Desco Constants.Purchase.checkoutURL), so the store link can change —
    // test → live, new product — without shipping a new app build.
    // PLACEHOLDER: paste the Lemon Squeezy checkout link here once it exists,
    // e.g. "https://pmworks.lemonsqueezy.com/buy/<variant-id>".
    var CHECKOUT_URL = "";
    if (CHECKOUT_URL) {
      // Pass any query through (e.g. a discount code) to the checkout.
      window.location.replace(CHECKOUT_URL + window.location.search);
    }
  </script>
</head>
